<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TinyLife</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- Верхняя панель -->
        <header class="top-bar">

            <div class="game-title">
                <h1>TinyLife</h1>
                <p id="day">Понедельник, 1 сентября</p>
            </div>

            <div class="clock" id="clock">
                07:00
            </div>

        </header>


        <!-- Комната -->
        <main class="room">

    <div class="window interactable"
         data-object="window"
         onclick="interact('window')">
        ☀️
    </div>

    <div class="bed interactable"
         data-object="bed"
         onclick="interact('bed')">
        🛏️
    </div>

    <div class="desk interactable"
         data-object="computer"
         onclick="interact('computer')">
        🖥️
    </div>

    <div class="plant interactable"
         data-object="plant"
         onclick="interact('plant')">
        🪴
    </div>

    <div class="rug"></div>

    <div class="character"
         id="character"
         onclick="interact('character')">
        🧍
    </div>

    <div class="door interactable"
         data-object="door"
         onclick="interact('door')">
        🚪
    </div>

</main>
        <!-- Характеристики -->
        <section class="stats">

            <div class="stat">
                <span>⚡ Энергия</span>
                <strong id="energy">80</strong>
            </div>

            <div class="stat">
                <span>🍎 Голод</span>
                <strong id="hunger">70</strong>
            </div>

            <div class="stat">
                <span>🙂 Настроение</span>
                <strong id="mood">75</strong>
            </div>

            <div class="stat">
                <span>💶 Деньги</span>
                <strong id="money">50</strong>
            </div>

        </section>
        
<section class="character-menu">
    <button onclick="openCharacterEditor()">
        👤 Персонаж
    </button>
</section>

        <!-- Действия -->
        <section class="actions">

            <button onclick="gameAction('sleep')">
                🛏️ Спать
            </button>

            <button onclick="gameAction('eat')">
                🍳 Поесть
            </button>

            <button onclick="gameAction('wash')">
                🚿 Умыться
            </button>

            <button onclick="gameAction('rest')">
                🪑 Отдохнуть
            </button>
            <button onclick="work()">
                💼 Работать
            </button>
        </section>


        <!-- Сообщения -->
        <div class="message" id="message">
            Добро пожаловать в TinyLife 🌷
        </div>

    </div>

<div class="editor-overlay" id="characterEditor">

    <div class="character-editor">

        <button class="close-editor"
                onclick="closeCharacterEditor()">
            ✕
        </button>

        <h2>Создание персонажа</h2>

        <div class="character-preview">

            <div id="characterPreview">
                👤
            </div>

        </div>

        <div class="editor-section">

            <label>
                Имя
            </label>

            <input
                id="characterName"
                type="text"
                placeholder="Введите имя"
                maxlength="20"
            >

        </div>


        <div class="editor-section">

            <label>
                Волосы
            </label>

            <div class="selector">

                <button onclick="changeHair(-1)">
                    ◀
                </button>

                <span id="hairValue">
                    Волосы 1
                </span>

                <button onclick="changeHair(1)">
                    ▶
                </button>

            </div>

        </div>


        <div class="editor-section">

            <label>
                Глаза
            </label>

            <div class="selector">

                <button onclick="changeEyes(-1)">
                    ◀
                </button>

                <span id="eyesValue">
                    Глаза 1
                </span>

                <button onclick="changeEyes(1)">
                    ▶
                </button>

            </div>

        </div>


        <div class="editor-section">

            <label>
                Верх
            </label>

            <div class="selector">

                <button onclick="changeTop(-1)">
                    ◀
                </button>

                <span id="topValue">
                    Верх 1
                </span>

                <button onclick="changeTop(1)">
                    ▶
                </button>

            </div>

        </div>


        <div class="editor-section">

            <label>
                Низ
            </label>

            <div class="selector">

                <button onclick="changeBottom(-1)">
                    ◀
                </button>

                <span id="bottomValue">
                    Низ 1
                </span>

                <button onclick="changeBottom(1)">
                    ▶
                </button>

            </div>

        </div>


        <button class="save-character"
                onclick="saveCharacter()">

            💾 Сохранить персонажа

        </button>

    </div>

</div>
    <script src="game.js"></script>

</body>
</html>
